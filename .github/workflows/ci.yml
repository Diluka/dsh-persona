name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PNPM_VERSION: "10.34.1"
  DSH_VERSION: "0.1.2-rc.1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack:dry-run
      - run: git diff --check

  dsh-web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Pack plugin
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/plugin-pack"
          echo "PLUGIN_TARBALL=$(printf '%s' "$RUNNER_TEMP"/plugin-pack/*.tgz)" >> "$GITHUB_ENV"
      - name: Install plugin and start DSH web
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          port=3080
          log="$RUNNER_TEMP/dsh-web-smoke.log"
          dsh() { pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" "$@"; }

          dsh plugin --profile web add "$PLUGIN_TARBALL"
          dsh --profile web --dump-config | grep -q "name: dsh-persona"
          DSH_TELEMETRY_MODE=DISABLED dsh web --host 127.0.0.1 --port "$port" --no-open >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "dsh web exited before serving http://127.0.0.1:$port/"
              sed -n '1,240p' "$log"
              exit 1
            fi
            url="$(awk '$1 == "dsh" && $2 == "web:" && $3 ~ /^https?:\/\// { print $3 }' "$log" | tail -n 1)"
            if [[ -n "$url" ]] && curl -fsSL --cookie-jar "$RUNNER_TEMP/dsh-cookies.txt" "$url" >"$RUNNER_TEMP/dsh-index.html" 2>/dev/null; then
              sleep 2
              kill -0 "$pid"
              exit 0
            fi
            sleep 1
          done

          echo "timed out waiting for http://127.0.0.1:$port/"
          sed -n '1,240p' "$log"
          exit 1
